services:
  # One SQL Server, the official image, holding the three sample databases. Each database comes from its image of
  #   https://hub.docker.com/r/jinahya/sql-server-samples         (also ghcr.io/jinahya/sql-server-samples)
  #   https://github.com/jinahya/sql-server-samples-docker
  # which is not run: its /opt/sample-databases, the database's backup or scripts, is mounted read-only (an image
  # mount, Docker Engine 28 or later), and ./opt/sample-databases/load.sh loads them all, AdventureWorks and
  # WideWorldImporters restored from their backups, FutonManufacturing built from its scripts, then creates the dmlonly
  # login the integration tests connect as. `<database>-2025` is rebuilt weekly on
  # mcr.microsoft.com/mssql/server:2025-latest; a SQL Server build tag, `adventureworks-17.0.5035.5` say, never changes.
  #
  # SQL Server is linux/amd64 only; on Apple silicon it runs under Rosetta (Docker Desktop: Use Rosetta for
  # x86_64/amd64 emulation).
  #
  # The health check reports healthy only once every database is loaded, under a minute. /var/opt/mssql, the data, the
  # log and the secrets, is not mounted (its line below is commented out), and the image declares no volume for it, so
  # it lives in the container, which `down` removes, and every run loads the databases again.
  sqlserver-samples:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sqlserver-samples
    ports:
      - "1433:1433"
    environment:
      # required; Y accepts the SQL Server license (https://go.microsoft.com/fwlink/?linkid=857698), and without it
      # SQL Server exits at start. MSSQL_PID=developer, free for development and testing only, is preset by the image.
      ACCEPT_EULA: "Y"
      # required, and must meet SQL Server's password policy; dmlonly takes it too, and each module's persistence.xml
      # repeats it as jakarta.persistence.jdbc.password.
      MSSQL_SA_PASSWORD: Passw0rd!
    entrypoint: [ "/opt/sample-databases/entrypoint.sh" ]
    command: [ "/opt/mssql/bin/sqlservr" ]
    volumes:
      - ./opt/sample-databases:/opt/sample-databases:ro
      # not bound: the databases live in the container, which `down` removes, so every run loads them afresh. Bound,
      # load.sh finds its marker there and loads nothing on a later start; the directory must be writable by the
      # image's mssql user (uid 10001).
#      - ./var/opt/mssql:/var/opt/mssql
      - type: image
        source: jinahya/sql-server-samples:adventureworks-2025
        target: /sample-databases/adventureworks
        image:
          subpath: opt/sample-databases
      - type: image
        source: jinahya/sql-server-samples:wideworldimporters-2025
        target: /sample-databases/wideworldimporters
        image:
          subpath: opt/sample-databases
      - type: image
        source: jinahya/sql-server-samples:futon-manufacturing-2025
        target: /sample-databases/futonmanufacturing
        image:
          subpath: opt/sample-databases
    healthcheck:
      test: [ "CMD", "/opt/sample-databases/healthcheck.sh" ]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 60
