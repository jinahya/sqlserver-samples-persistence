services:
  # The official SQL Server image with one of Microsoft's sample databases loaded on first start, an image per database:
  #   https://hub.docker.com/r/jinahya/sql-server-samples         (also ghcr.io/jinahya/sql-server-samples)
  #   https://github.com/jinahya/sql-server-samples-docker
  # AdventureWorks and WideWorldImporters are restored from their backups, FutonManufacturing is built from its
  # scripts. `<database>-2025` is rebuilt weekly on mcr.microsoft.com/mssql/server:2025-latest; a SQL Server build tag,
  # `adventureworks-17.0.5035.5` say, never changes.
  #
  # SQL Server is linux/amd64 only; on Apple silicon it runs under Rosetta (Docker Desktop: Use Rosetta for
  # x86_64/amd64 emulation).
  #
  # Each image's own HEALTHCHECK reports healthy only once its database is loaded, under a minute. /var/opt/mssql is
  # not mounted, so it lives in the container's anonymous volume, which `down -v` removes, and every run loads the
  # databases again.
  adventureworks:
    image: jinahya/sql-server-samples:adventureworks-2025
    platform: linux/amd64
    container_name: adventureworks
    ports:
      - "1433:1433"
    environment: &environment
      # required; Y accepts the SQL Server license (https://go.microsoft.com/fwlink/?linkid=857698), and without it
      # SQL Server exits at start. MSSQL_PID=developer, free for development and testing only, is preset by the image.
      ACCEPT_EULA: "Y"
      # required, and must meet SQL Server's password policy; each module's persistence.xml repeats it as
      # jakarta.persistence.jdbc.password.
      MSSQL_SA_PASSWORD: Passw0rd!
  wideworldimporters:
    image: jinahya/sql-server-samples:wideworldimporters-2025
    platform: linux/amd64
    container_name: wideworldimporters
    ports:
      - "1434:1433"
    environment: *environment
  futonmanufacturing:
    image: jinahya/sql-server-samples:futon-manufacturing-2025
    platform: linux/amd64
    container_name: futonmanufacturing
    ports:
      - "1435:1433"
    environment: *environment
