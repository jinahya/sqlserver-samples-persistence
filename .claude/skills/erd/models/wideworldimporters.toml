# The logical model of WideWorldImporters, from the installed database's catalog (sys.tables, sys.views,
# sys.key_constraints, sys.foreign_keys, sys.sql_expression_dependencies): each table's keys, each view's
# tables, and the logical groups, which the upstream does not name and are inferred; a group may repeat a
# table of another, to show how the two meet. The names are qualified by the schema. The 17 history tables
# of the system-versioned tables, which have no key and are referenced by none, are left out.

schema = "WideWorldImporters"
title = "WideWorldImporters"
output = "mssql-sample-databases-persistence-wideworldimporters/docs/erd"

[[group]]
name = "application"
title = "사람과 공통 참조 테이블"
tables = ["Application.People", "Application.DeliveryMethods", "Application.PaymentMethods", "Application.TransactionTypes"]

[[group]]
