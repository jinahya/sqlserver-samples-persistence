# The logical model of FutonManufacturing, from the installed database's catalog (sys.tables, sys.views,
# sys.key_constraints, sys.foreign_keys, sys.sql_expression_dependencies): each table's keys, each view's
# tables, and the logical groups, which the upstream does not name and are inferred; a group may repeat a
# table of another, to show how the two meet. Every object is in dbo, so
# the names are not qualified.

schema = "FutonManufacturing"
title = "FutonManufacturing"
output = "mssql-sample-databases-persistence-futonmanufacturing/docs/erd"

[[group]]
name = "items"
title = "품목"
tables = ["UnitOfMeasure", "ItemType", "Items", "BillOfMaterials"]

[[group]]
name = "inventory"
title = "재고"
tables = ["Warehouse", "Inventory", "TransactionType", "InventoryTransaction", "Items"]

[[group]]
name = "purchasing"
title = "구매"
tables = ["Supplier", "SupplierItem", "PurchaseOrder", "PurchaseOrderDetail", "Items"]

[[group]]
name = "production"
title = "생산"
tables = ["WorkCenter", "ProductionOrder", "ProductionOrderMaterial", "ProductionCompletion", "QualityInspection", "Items"]

[[group]]
name = "sales"
title = "판매"
tables = ["Customer", "SalesOrder", "SalesOrderDetail", "SalesChannel", "Store", "SalesTerritory", "SalesRep", "Items"]

[[group]]
name = "quotes_and_returns"
title = "견적과 반품"
tables = ["SalesQuote", "SalesQuoteDetail", "SalesReturn", "SalesReturnDetail", "ReturnReason", "SalesOrder", "SalesOrderDetail", "Customer"]

[[group]]
name = "prices"
title = "가격표와 판촉"
tables = ["PriceList", "PriceListDetail", "Promotion", "SalesChannel", "Items"]

