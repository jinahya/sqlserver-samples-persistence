# The logical model of AdventureWorks, from the installed database's catalog (sys.tables, sys.views,
# sys.key_constraints, sys.foreign_keys, sys.sql_expression_dependencies): each table's keys, each view's
# tables, and the logical groups, which the upstream does not name and are inferred; a group may repeat a table
# of another, to show how the two meet. The names are qualified by the schema.

